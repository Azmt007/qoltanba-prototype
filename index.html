  _accountModal(){ App.modal(`<div class="modal-h"><h2>Новый расчётный счёт</h2><button class="x" onclick="App.close()">×</button></div><div class="modal-b"><div class="note info mb12 small">Смена реквизитов требует второго фактора (код на подтверждённый телефон) — эмуляция.</div><div class="field"><label>ИИК</label><input type="text" id="acIik" placeholder="KZ…"></div><div class="field"><label>Банк</label><select id="acBank">${DICT.banks.map(b=>`<option value="${b.bik}">${e(b.name)} · ${b.bik}</option>`).join('')}</select></div><div class="field"><label>КБе</label><input type="text" id="acKbe" value="17"></div><div class="field"><label>Код из SMS</label><input type="text" placeholder="123456"></div></div><div class="modal-f"><button class="btn" onclick="App.close()">Отмена</button><button class="btn primary" onclick="const iik=document.getElementById('acIik').value.trim();if(!/^KZ[0-9A-Z]{18}$/.test(iik)){App.toast('ИИК: KZ + 18 символов','err');return;}const b=DICT.banks.find(x=>x.bik===document.getElementById('acBank').value);App.company.accounts.push({iik,bank:b.name,bik:b.bik,kbe:document.getElementById('acKbe').value,main:!App.company.accounts.length});App.audit('Добавлен расчётный счёт '+iik);App.save();App.close();App.render()">Добавить</button></div>`); },
  employees(){ const c=App.company; const ms=DB.memberships.filter(m=>m.companyId===c.id); const canAdm=App.can('admin');
    return head('Сотрудники и права',`Подписание доступно только сотрудникам с ЭЦП, сертификат которой принадлежит БИН ${c.bin}. Один пользователь может состоять в нескольких компаниях.`,canAdm?`<button class="btn primary" onclick="Views._inviteModal()">+ Пригласить сотрудника</button>`:'')+
    `<div class="card pad0"><table><thead><tr><th>Сотрудник</th><th>Роль</th><th>ЭЦП</th><th>Права</th><th>Другие компании</th></tr></thead><tbody>${ms.map(m=>{const u=usr(m.userId); const certOk=u.cert&&u.cert.bin===c.bin; const others=DB.memberships.filter(x=>x.userId===u.id&&x.companyId!==c.id).map(x=>co(x.companyId).name);

  _inviteModal(){ App.modal(`<div class="modal-h"><h2>Пригласить сотрудника</h2><button class="x" onclick="App.close()">×</button></div><div class="modal-b"><div class="grid g2"><div class="field"><label>ФИО</label><input type="text" id="inName"></div><div class="field"><label>Email</label><input type="email" id="inEmail"></div><div class="field"><label>Роль (подпись)</label><input type="text" id="inRole" value="Сотрудник"></div></div><div class="field"><label>Права</label><div class="rights">${DICT.rights.map(([k,l])=>`<label class="chk small"><input type="checkbox" value="${k}" ${['catalog','orders'].includes(k)?'checked':''}>${l}</label>`).join('')}</div></div></div><div class="modal-f"><button class="btn" onclick="App.close()">Отмена</button><button class="btn primary" onclick="const n=document.getElementById('inName').value.trim(),em=document.getElementById('inEmail').value.trim();if(!n||!em){App.toast('Заполните ФИО и email','err');return;}const r=[...document.querySelectorAll('#modal .rights input:checked')].map(i=>i.value);let u=DB.users.find(x=>x.email===em);if(!u){u={id:U.uid('u'),name:n,email:em,phone:'',cert:null};DB.users.push(u);}DB.memberships.push({userId:u.id,companyId:App.company.id,role:document.getElementById('inRole').value,rights:r,status:'active',invited:U.today()});App.audit('Приглашён сотрудник '+n+' ('+em+'), права: '+r.join(', '));App.save();App.refreshUsers();App.close();App.toast('Приглашение отправлено на '+em,'ok')">Пригласить</button></div>`); },

  invite(token){ const cp=DB.counterparties.find(x=>x.token===token); if(!cp) return head('Приглашение')+`<div class="card">${empty('Ссылка недействительна','Приглашение не найдено или уже использовано')}</div>`;

    ${invs.length?`<div class="card pad0 mt16"><div style="padding:12px 16px"><h2 style="margin:0">Счета на оплату</h2></div><table><tbody>${invs.map(d=>`<tr><td><b>${e(d.number)}</b> · ${e(d.kind||'')}<div class="small muted">срок ${U.fmtDate(d.dueDate)}</div></td><td class="num">${U.money(d.amountTiyn)}</td><td class="right"><button class="btn sm" onclick="DocView.show('${d.id}')">Открыть</button></td></tr>`).join('')}</tbody></table></div>`:''}
    ${orders.length?`<div class="card pad0 mt16"><div style="padding:12px 16px"><h2 style="margin:0">Ваши заказы у ${e(inviter.name)}</h2></div>${orders.map(o=>`<div class="between" style="padding:10px 16px;border-top:1px solid var(--line)"><div><b>${e(o.number)}</b> · ${o.items.length} поз. · ${U.money(orderTotal(o).total)}</div>${ostatus(o.status)}</div>`).join('')}</div>`:''}</div>
    <div><div class="card"><h2>Профиль по БИН <span class="small faint">(реестр, эмуляция)</span></h2><table class="small"><tr><td class="muted">Наименование</td><td>${e(cp.name)}</td></tr><tr><td class="muted">БИН/ИИН</td><td class="mono">${cp.bin}</td></tr><tr><td class="muted">Статус</td><td>действующий</td></tr><tr><td class="muted">Email</td><td>${e(cp.email||'—')}</td></tr></table><div class="note info mt12 small">Упрощённый вход: документы привязываются к БИН после регистрации. Закрытый ключ ЭЦП не покидает ваше устройство.</div></div>

  _guestSign(id, kind, cpId){ const cp=byId(DB.counterparties,cpId); const shadow=DB.companies.find(x=>x.bin===cp.bin); const d=kind==='contract'?byId(DB.contracts,id):doc(id); const title=kind==='contract'?`Договор ${d.number}`:`${DICT.docType[d.type]} ${d.number}`;

    <div class="modal-f"><button class="btn" onclick="App.close()">Отмена</button><button class="btn primary" id="gsBtn">Подписать</button></div>`);
    $('#gsBtn').onclick=()=>{ $('#gsBtn').innerHTML='<span class="sp"></span> Подписание…'; setTimeout(()=>{ d.signatures.push({companyId:shadow.id, userId:null, fio:'РУКОВОДИТЕЛЬ '+cp.name.replace(/ТОО|ИП|«|»/g,'').trim().toUpperCase(), date:U.now(), cms:'MIIG…', method:'NCALayer (упрощённый вход)'}); if(kind==='contract') Biz.afterSign({...d,isContract:true}); else Biz.afterSign(d); DB.audit.unshift({date:U.now(), who:cp.name, companyId:shadow.id, action:`Подписан ${title} по приглашению (упрощённый вход)`, ip:'эмуляция'}); App.save(); App.close(); App.toast(title+' подписан','ok'); App.render(); },900); }; },
  _regOneStep(cpId){ const cp=byId(DB.counterparties,cpId); App.modal(`<div class="modal-h"><h2>Регистрация в один шаг</h2><button class="x" onclick="App.close()">×</button></div><div class="modal-b"><div class="note mb12 small">Данные компании уже заполнены по БИН ${cp.bin}. Укажите контакты руководителя и подтвердите ЭЦП. Акцепт: оферта v1.2, политика конфиденциальности v1.0, согласие на обработку ПД v1.0 (фиксируются с версией и временем).</div><div class="grid g2"><div class="field"><label>ФИО руководителя</label><input type="text" id="rName" value="${e(cp.name.includes('ИП')?cp.name.replace(/ИП|«|»/g,'').trim():'')}"></div><div class="field"><label>Email</label><input type="email" id="rEmail" value="${e(cp.email||'')}"></div><div class="field"><label>Телефон</label><input type="text" id="rPhone" placeholder="+7 7__ ___ __ __"></div><div class="field"><label>Код из SMS / email</label><input type="text" placeholder="123456"></div></div><label class="chk"><input type="checkbox" id="rAcc"> Принимаю пользовательское соглашение, политику конфиденциальности и даю согласие на обработку персональных данных</label></div>

  register(){ const st=Views._reg||{}; return `<div class="hero mb16"><div><h1>Регистрация компании</h1><p>По БИН (для ИП — ИИН). Данные подтягиваются из открытых реестров; при неудачном запросе — ручная модерация. Затем подтверждение ЭЦП руководителя через NCALayer.</p></div></div>

  moderation(){ if(!App.isAdmin) return Views.notfound(); const prods=DB.products.filter(p=>p.status==='moderation'); const comps=DB.companies.filter(c=>c.status==='pending');
    return head('Модерация',`Регистрации, позиции каталога, жалобы`)+`<div class="card pad0"><div style="padding:12px 16px"><h2 style="margin:0">Регистрации (${comps.length})</h2></div>${comps.length?`<table><tbody>${comps.map(c=>`<tr><td><b>${e(c.name)}</b><div class="small muted">БИН ${c.bin} · ${e(c.registry.source)}</div></td><td class="right"><button class="btn sm primary" onclick="const c=co('${c.id}');c.status='active';c.verified=c.verified||{date:U.now(),cert:'ручное подтверждение администратором'};App.audit('Ручное подтверждение регистрации '+c.name,null);App.save();App.render()">Подтвердить</button> <button class="btn sm danger" onclick="co('${c.id}').status='blocked';App.audit('Отклонена регистрация','${c.id}');App.save();App.render()">Отклонить</button></td></tr>`).join('')}</tbody></table>`:empty('Нет регистраций на модерации')}</div>
    <div class="card pad0 mt16"><div style="padding:12px 16px"><h2 style="margin:0">Позиции каталога (${prods.length})</h2></div>${prods.length?`<table><thead><tr><th>Позиция</th><th>Поставщик</th><th class="num">Цена</th><th>ТН ВЭД</th><th></th></tr></thead><tbody>${prods.map(p=>`<tr><td><b>${e(p.name)}</b><div class="small muted">${e(DICT.categories.find(x=>x.id===p.categoryId)?.name)} · ${e(p.sku)}</div></td><td>${e(co(p.supplierId).name)}</td><td class="num">${U.money(p.priceTiyn)}</td><td class="mono small">${e(p.tnved||'—')}</td><td class="right"><button class="btn sm primary" onclick="byId(DB.products,'${p.id}').status='published';App.audit('Опубликована позиция ${e(p.name)}',null);App.notify('${p.supplierId}','Позиция «${e(p.name)}» опубликована','my-catalog','moderation');App.save();App.render()">Опубликовать</button> <button class="btn sm danger" onclick="byId(DB.products,'${p.id}').status='rejected';App.notify('${p.supplierId}','Позиция «${e(p.name)}» отклонена модератором','my-catalog','moderation');App.save();App.render()">Отклонить</button></td></tr>`).join('')}</tbody></table>`:empty('Нет позиций на модерации')}</div>`; },
  companies(){ if(!App.isAdmin) return Views.notfound(); return head('Реестр компаний',`${DB.companies.length} компаний`)+`<div class="card pad0"><table><thead><tr><th>Компания</th><th>Роль</th><th>Налоги</th><th>ЭЦП</th><th>Уровень</th><th>Статус</th><th></th></tr></thead><tbody>${DB.companies.map(c=>`<tr><td><b>${e(c.name)}</b><div class="small muted">БИН ${c.bin} · ${e(c.region)} · с ${U.fmtDate(c.since)}</div></td><td>${c.roles.map(r=>badge(r==='buyer'?'покупатель':'поставщик','outline')).join(' ')}</td><td class="small">${c.taxRegime}, ${c.vatPayer?'НДС':'без НДС'}${c.esfParticipant?', ИС ЭСФ':''}</td><td>${c.verified?'✓':'—'}</td><td>${badge(c.level,'outline')}</td><td>${c.status==='active'?badge('Активна','ok'):c.status==='blocked'?badge('Заблокирована','danger'):c.status==='invited'?badge('Приглашена','warn'):badge('Модерация','warn')}</td><td class="right nowrap"><select class="sel-ctx" style="padding:3px 24px 3px 8px;font-size:12px" onchange="const c=co('${c.id}');c.level=this.value;App.audit('Уровень '+c.name+' → '+this.value,null);App.save();App.render()">${['Новый','Проверенный','Надёжный','Партнёр'].map(l=>`<option ${c.level===l?'selected':''}>${l}</option>`).join('')}</select> <button class="btn sm ${c.status==='blocked'?'':'danger'}" onclick="const c=co('${c.id}');c.status=c.status==='blocked'?'active':'blocked';App.audit((c.status==='blocked'?'Блокировка ':'Разблокировка ')+c.name,null);App.save();App.render()">${c.status==='blocked'?'Разблокировать':'Блокировать'}</button></td></tr>`).join('')}</tbody></table></div>`; },
  disputes(){ if(!App.isAdmin) return Views.notfound(); const list=DB.disputes; return head('Споры',`Администратор — медиатор: переписка, предложение решения, фиксация итога. Решение не обязательно для сторон.`)+`<div class="card pad0">${list.length?`<table><thead><tr><th>Заказ</th><th>Инициатор</th><th>Причина</th><th>Статус</th><th></th></tr></thead><tbody>${list.map(d=>{const o=ord(d.orderId); return `<tr><td><b>${e(o.number)}</b><div class="small muted">${e(co(o.buyerId).name)} ↔ ${e(co(o.supplierId).name)}</div></td><td>${e(co(d.initiatorId).name)}</td><td class="small">${e(d.reason)}</td><td>${d.status==='open'?badge('Открыт','danger'):d.status==='settled'?badge('Урегулирован','ok'):badge('Не урегулирован','outline')}${d.resolution?`<div class="small muted">${e(d.resolution)}</div>`:''}</td><td class="right">${d.status==='open'?`<button class="btn sm primary" onclick="Views._disputeModal('${d.id}')">Медиация</button>`:''}</td></tr>`;}).join('')}</tbody></table>`:empty('Споров нет')}</div>`; },
  _disputeModal(did){ const d=byId(DB.disputes,did); const o=ord(d.orderId); App.modal(`<div class="modal-h"><h2>Спор по заказу ${e(o.number)}</h2><button class="x" onclick="App.close()">×</button></div><div class="modal-b"><div class="small mb12">${d.messages.map(m=>`<div class="note mb8"><b>${e(m.who)}</b> <span class="faint">${U.fmtDT(m.date)}</span><div>${e(m.text)}</div></div>`).join('')}</div><div class="field"><label>Предложение решения (фиксируется в карточке заказа)</label><textarea id="dsRes" style="font-family:Inter" placeholder="Поставщик допоставляет 5 мешков до 05.11; корректирующие документы формируются из заказа"></textarea></div></div>
    <div class="modal-f"><button class="btn" onclick="App.close()">Отмена</button><button class="btn" onclick="const t=document.getElementById('dsRes').value.trim();if(!t)return;Biz.resolveDispute('${did}',t,false);App.close();App.render()">Закрыть: не урегулирован</button><button class="btn primary" onclick="const t=document.getElementById('dsRes').value.trim();if(!t){App.toast('Опишите решение','err');return;}Biz.resolveDispute('${did}',t,true);App.close();App.render()">Закрыть: урегулирован</button></div>`); },
  dicts(){ if(!App.isAdmin) return Views.notfound(); return head('Справочники','Ставки НДС с датами действия, правила ЭСФ, единицы, регионы, категории — меняются без релиза кода')+`<div class="grid g2"><div class="card"><h2>Ставки НДС (по дате оборота)</h2><table class="small"><thead><tr><th>Код</th><th>Название</th><th>Периоды</th></tr></thead><tbody>${DICT.vatRates.map(r=>`<tr><td class="mono">${r.code}</td><td>${e(r.label)}</td><td>${r.periods.map(p=>`<div>${U.fmtDate(p.from)} — ${p.to?U.fmtDate(p.to):'…'}: <b>${p.rate===null?'без НДС':p.rate+'%'}</b></div>`).join('')}</td></tr>`).join('')}</tbody></table><div class="note warn mt12 small">Ставки с 01.01.2026 (16/10/5) — по НК РК 2026; значения требуют проверки бухгалтером-методологом перед разработкой.</div></div>
    <div class="card"><h2>Правило срока ЭСФ</h2><div class="field"><label>Дней от даты оборота</label><input type="number" value="${DICT.esfRule.deadlineDays}" onchange="DICT.esfRule.deadlineDays=Number(this.value);App.audit('Изменён срок ЭСФ: '+this.value+' дн.',null);App.toast('Применится к новым заказам')"></div><div class="small muted">${e(DICT.esfRule.basis)}</div><h2 class="mt16">Единицы</h2><div>${DICT.units.map(u=>`<span class="tag">${u}</span>`).join('')}</div><h2 class="mt16">Регионы</h2><div>${DICT.regions.map(u=>`<span class="tag">${u}</span>`).join('')}</div><h2 class="mt16">Категории</h2><div>${DICT.categories.map(u=>`<span class="tag">${e(u.name)}</span>`).join('')}</div><div class="small faint mt8">КНП, банки, ТН ВЭД/ГСВС — загружаются из официальных источников, не вводятся вручную.</div></div></div>`; },
  templates(){ if(!App.isAdmin) return Views.notfound(); return head('Шаблоны документов','Библиотека блоков с версиями; изменение шаблона не затрагивает подписанные договоры')+`<div class="card pad0"><table><thead><tr><th>Шаблон</th><th>Версия</th><th>Языки</th><th>Блоки</th><th>Проверка юристом</th><th></th></tr></thead><tbody>${DB.templates.map(t=>`<tr><td><b>${e(t.name)}</b></td><td>v${t.version}</td><td>${e(t.lang)}</td><td class="small">${t.blocks.map(e).join(' · ')}</td><td class="${t.reviewed.startsWith('Юрист')?'ok-text':'warn-text'}">${e(t.reviewed)}</td><td class="right"><button class="btn sm" onclick="const t=DB.templates.find(x=>x.id==='${t.id}');t.version++;App.audit('Новая версия шаблона '+t.name+' v'+t.version,null);App.save();App.render()">Новая версия</button></td></tr>`).join('')}</tbody></table></div><div class="note mt16 small">Формы З-2, Р-1, счёт — проходят проверку юристом и бухгалтером до релиза. Переменные: обязательные, необязательные, вычисляемые (сумма прописью).</div>`; },
  audit(){ if(!App.isAdmin) return Views.notfound(); return head('Журнал аудита','Неизменяемый: кто, когда, что, IP')+`<div class="card pad0"><table><thead><tr><th>Время</th><th>Кто</th><th>Компания</th><th>Действие</th><th>IP</th></tr></thead><tbody>${DB.audit.map(a=>`<tr><td class="nowrap small">${U.fmtDT(a.date)}</td><td>${e(a.who)}</td><td class="small">${a.companyId?e(co(a.companyId)?.name||''):'—'}</td><td>${e(a.action)}</td><td class="faint small">${e(a.ip)}</td></tr>`).join('')}</tbody></table></div>`; },
};

document.addEventListener('DOMContentLoaded', ()=>{ try{ App.init(); }catch(err){ console.error(err); document.getElementById('page').innerHTML='<div class="nojs"><h2>Прототип не запустился</h2><p>Ошибка: '+U.esc(err.message)+'. Откройте файл в Chrome, Safari или Edge на компьютере, либо нажмите «Сбросить демо-данные» сверху.</p></div>'; } });
</script>
</body>
</html>
